<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f2a33"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="น้ำวันนี้"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/icon-192.png"><title>ฝน | น้ำวันนี้</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="style.css"></head>
<body><header class="top"></header><main class="wrap">
<h1>ฝนที่ตกแล้ว</h1><p class="sub">50 จุดที่ฝนตกหนักที่สุด เลือกช่วงเวลาที่อยากดูได้จากปุ่มด้านล่าง</p><div class="tools" id="tabs"></div>
<div class="status" id="st">กำลังโหลด…</div>
<div class="legend"><p>ฝนมากแค่ไหน (มิลลิเมตรใน 1 วัน)</p><span class="lv l1"><i></i>เล็กน้อย: ต่ำกว่า 10</span><span class="lv l2"><i></i>ปานกลาง: 10-35</span><span class="lv l3"><i></i>หนัก: 35-90</span><span class="lv l4"><i></i>หนักมาก: 90 ขึ้นไป</span></div><div class="tools"><input id="q" type="search" placeholder="พิมพ์ชื่อจังหวัด"></div>
<div class="tablebox"><table><thead><tr><th>จุดวัดฝน</th><th>จังหวัด</th><th id="hv">ฝน 24 ชม. (มม.)</th><th>ฝนมากแค่ไหน</th></tr></thead><tbody id="tb"></tbody></table></div>
</main><footer></footer><script src="app.js"></script><script>
nav('rain.html');let rows=[];
const cls=v=>v>=90?['ฝนหนักมาก','l4']:v>=35?['ฝนหนัก','l3']:v>=10?['ฝนปานกลาง','l2']:['ฝนเล็กน้อย','l1'];
function draw(){const q=$('#q').value.trim();
 $('#tb').innerHTML=rows.filter(r=>!q||r.prov.includes(q)).slice(0,50).map(r=>{const[c,k]=cls(r.v);return `<tr><td>${esc(r.n)}</td><td>${esc(r.prov)}</td><td>${num(r.v,1)}</td><td><span class="lv ${k}"><i></i>${c}</span></td></tr>`}).join('')||'<tr><td colspan="4">ไม่พบข้อมูล</td></tr>'}
const TABS=[['rain_24h','24 ชั่วโมง'],['rain_today','วันนี้'],['rain_yesterday','เมื่อวานนี้'],['rain_monthly','เดือนนี้'],['rain_yearly','ปีนี้']];let cur='rain_24h';
const val=r=>{if(r[cur]!=null&&isFinite(parseFloat(r[cur])))return parseFloat(r[cur]);for(const k in r){if(/^rain/.test(k)&&typeof r[k]!=='object'&&!/date|time/.test(k)&&isFinite(parseFloat(r[k])))return parseFloat(r[k])}return NaN};
async function go(){const res=await load('public/'+cur,{});$('#hv').textContent='ฝน'+TABS.find(t=>t[0]===cur)[1]+' (มม.)';
 const d=findRows(res.data)||[];
 rows=d.map(r=>({n:tx(r.station?.tele_station_name),prov:tx(r.geocode?.province_name),v:val(r)})).filter(r=>isFinite(r.v)).sort((a,b)=>b.v-a.v);
 status($('#st'),res);draw()}
$('#tabs').innerHTML=TABS.map(t=>`<button data-k="${t[0]}" aria-pressed="${t[0]===cur}">${t[1]}</button>`).join('');
$('#tabs').onclick=e=>{const k=e.target.dataset?.k;if(!k)return;cur=k;document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));go()};
$('#q').oninput=draw;go();
</script></body></html>
